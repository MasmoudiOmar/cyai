# Spoken screening: what you said and how you said it.
id: spoken-screen
version: 1
name: Spoken screen
passThreshold: 3.5
criteria:
  - id: substance
    label: Substance and expertise
    weight: 0.35
    levels:
      - { score: 1, description: "Does not answer the question or shows no real knowledge." }
      - { score: 3, description: "Answers the question with general, partly correct knowledge." }
      - { score: 5, description: "Answers directly with accurate, expert-level detail." }
  - id: evidence
    label: Concrete evidence
    weight: 0.25
    levels:
      - { score: 1, description: "Only claims, no example from real experience." }
      - { score: 3, description: "One example, but thin on what you did and the outcome." }
      - { score: 5, description: "A specific example with your own actions and a measurable result." }
  - id: fluency
    label: Fluency
    weight: 0.2
    levels:
      - { score: 1, description: "More than 8 fillers per minute, frequent restarts or pauses over 5 seconds." }
      - { score: 3, description: "3 to 8 fillers per minute or pace outside 110-170 words per minute." }
      - { score: 5, description: "Under 3 fillers per minute, steady pace of 120-160 words per minute, no long pauses." }
  - id: concision
    label: Concision
    weight: 0.2
    levels:
      - { score: 1, description: "Rambles past the time limit or never reaches the point." }
      - { score: 3, description: "Reaches the point but with detours or repetition." }
      - { score: 5, description: "Leads with the answer and stays within the suggested time." }
